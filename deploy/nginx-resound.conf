# nginx vhost for resound.calebhugo.com
# Deploy to /etc/nginx/sites-available/resound.calebhugo.com on hugopi and
# symlink into sites-enabled. Served locally on 127.0.0.1:8100; the calebhugo
# Cloudflare Tunnel proxies resound.calebhugo.com -> this port. Changed it?
# Reinstall by hand: deploy/README.md "Updating the vhost".

# Caching. Vite's hashed build output (/assets/) never changes under a given
# name, so browsers and Cloudflare keep it a year without asking again.
# Everything else (index.html, the puzzle JSON) keeps its name across
# deploys: stored, but revalidated on every use (ETag / Last-Modified -> a
# 304 when unchanged), so a deploy is live on the next page load. A map, not
# per-location add_header: an add_header inside a location drops every
# add_header of the server block (the security headers below).
map $uri $resound_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 127.0.0.1:8100;
    server_name resound.calebhugo.com;

    root /var/www/resound.calebhugo.com;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Three.js (WebGL) + Web Audio game. Everything is same-origin; no external
    # scripts, fonts, or network calls. 'wasm-unsafe-eval' + worker-src cover a
    # possible AudioWorklet; 'unsafe-inline' styles cover the inline <style> in
    # index.html and UI style attributes. No 'unsafe-eval' for scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Successful responses only (no `always`): a 404 must not be cached a year
    add_header Cache-Control $resound_cache_control;
    etag on;

    # Compression. deploy/build-poc.mjs precompresses every text file at
    # level 9 (file.gz beside file) and gzip_static serves those, so the Pi
    # never compresses per request; gzip covers a file without one.
    # gzip_proxied: nginx skips requests that came through a proxy by default.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # Dotfiles stay private
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
