# nginx vhost for resound.calebhugo.com
# Deploy to /etc/nginx/sites-available/resound.calebhugo.com on hugopi and
# symlink into sites-enabled. Served locally on 127.0.0.1:8100; the calebhugo
# Cloudflare Tunnel proxies resound.calebhugo.com -> this port.
server {
    listen 127.0.0.1:8100;
    server_name resound.calebhugo.com;

    root /var/www/resound.calebhugo.com;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Three.js (WebGL) + Web Audio game. Everything is same-origin; no external
    # scripts, fonts, or network calls. 'wasm-unsafe-eval' + worker-src cover a
    # possible AudioWorklet; 'unsafe-inline' styles cover the inline <style> in
    # index.html and UI style attributes. No 'unsafe-eval' for scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
